name: Process ingestion job

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Cloudflare Queue message JSON"
        required: true
      force:
        description: "Force FastF1 reingestion"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - ingest_session

permissions:
  contents: read

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET || 'formula-1-data-artifacts' }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      INGESTION_API_TOKEN: ${{ secrets.INGESTION_API_TOKEN }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: backend/data/cache/fastf1
          key: ${{ runner.os }}-fastf1-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-fastf1-

      - name: Write queue message
        env:
          WORKFLOW_MESSAGE: ${{ inputs.message }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python -c "import json, os; print(json.dumps(json.loads(os.environ['DISPATCH_PAYLOAD'])['message']))" > message.json
          else
            printf '%s' "$WORKFLOW_MESSAGE" > message.json
          fi
          python -m json.tool message.json > /dev/null

      - name: Validate queue message
        run: |
          python - <<'PY'
          import json
          import sys

          required = [
              "job_id",
              "session_id",
              "year",
              "round",
              "session",
              "artifact_base_path",
          ]

          with open("message.json", encoding="utf-8") as handle:
              message = json.load(handle)

          if not isinstance(message, dict):
              print("::error::message.json must contain a JSON object queue message.")
              sys.exit(1)

          missing = [
              field
              for field in required
              if field not in message or message[field] in (None, "")
          ]

          if missing:
              print(
                  "::error::message.json is missing required queue message fields: "
                  + ", ".join(missing)
              )
              print(
                  "::error::Expected the ingestion queue message, not a Worker status response or callback payload."
              )
              sys.exit(1)

          print("Validated queue message for session_id=" + str(message["session_id"]))
          PY

      - name: Process ingestion job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          for attempt in 1 2 3; do
            echo "Starting ingestion attempt $attempt of 3"

            if python -m pipeline process-queue \
              --message-file message.json \
              --artifact-destination r2 \
              --r2-bucket "$R2_BUCKET" \
              --callback-url "$WORKER_BASE_URL" \
              --callback-token "$INGESTION_API_TOKEN" \
              $FORCE_FLAG; then
              echo "Ingestion attempt $attempt succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 60))
              echo "Ingestion attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            else
              echo "::error::Ingestion failed after 3 attempts"
              exit 1
            fi
          done

      - name: Verify remote R2 manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SESSION_ID="$(python -c "import json; print(json.load(open('message.json'))['session_id'])")"
          wrangler r2 object get "$R2_BUCKET/sessions/$SESSION_ID/manifest.json" --remote --file manifest-check.json
          python -m json.tool manifest-check.json > /dev/null

      - name: Upload generated data snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: frontend/public/data
