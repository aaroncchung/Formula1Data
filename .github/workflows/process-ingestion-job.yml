name: Process ingestion job

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Cloudflare Queue message JSON"
        required: true
      force:
        description: "Force FastF1 reingestion"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - ingest_session

permissions:
  contents: read

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET || 'formula-1-data-artifacts' }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      INGESTION_API_TOKEN: ${{ secrets.INGESTION_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      FASTF1_LOAD_ATTEMPTS: ${{ vars.FASTF1_LOAD_ATTEMPTS || '3' }}
      FASTF1_RETRY_BASE_DELAY_SECONDS: ${{ vars.FASTF1_RETRY_BASE_DELAY_SECONDS || '5' }}
      FASTF1_OPTIONAL_LOAD_DELAY_SECONDS: ${{ vars.FASTF1_OPTIONAL_LOAD_DELAY_SECONDS || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: backend/data/cache/fastf1
          key: ${{ runner.os }}-fastf1-${{ hashFiles('backend/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fastf1-${{ hashFiles('backend/requirements.txt') }}-
            ${{ runner.os }}-fastf1-

      - name: Show FastF1 cache state
        run: |
          if [ -d backend/data/cache/fastf1 ]; then
            CACHE_FILES="$(find backend/data/cache/fastf1 -type f | wc -l)"
            CACHE_BYTES="$(du -sh backend/data/cache/fastf1 | cut -f1)"
            echo "FastF1 cache contains ${CACHE_FILES} files (${CACHE_BYTES})."
          else
            echo "FastF1 cache directory does not exist yet."
          fi

      - name: Write queue message
        id: message
        env:
          WORKFLOW_MESSAGE: ${{ inputs.message }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python -c "import json, os; print(json.dumps(json.loads(os.environ['DISPATCH_PAYLOAD'])['message']))" > message.json
          else
            printf '%s' "$WORKFLOW_MESSAGE" > message.json
          fi
          python -m json.tool message.json > /dev/null

          # Publish job_id and project the queue message down to known-safe
          # fields for the diagnostics artifact, in a single interpreter run.
          #
          # This previously used:
          #   echo "job_id=$(python -c \"import json; ...\")" >> "$GITHUB_OUTPUT"
          # which is a bash syntax error. Inside $( ) a fresh parsing context
          # begins, so the backslash-escaped quotes did not quote the Python
          # source and bash tripped over the unquoted parentheses. Under
          # `bash -e` that killed the step, so every run failed here.
          #
          # job_id is read leniently: when it is absent the dedicated
          # validation step below reports the missing fields, which is a far
          # clearer error than a KeyError traceback out of this step.
          python - <<'PY'
          import json
          import os

          known = ("job_id", "session_id", "year", "round", "session", "artifact_base_path")

          with open("message.json", encoding="utf-8") as handle:
              message = json.load(handle)

          summary = {field: message[field] for field in known if field in message}
          summary["_redacted_extra_fields"] = sorted(set(message) - set(known))

          with open("message-summary.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("job_id={}\n".format(message.get("job_id", "")))
          PY

      - name: Validate queue message
        run: |
          python - <<'PY'
          import json
          import sys

          required = [
              "job_id",
              "session_id",
              "year",
              "round",
              "session",
              "artifact_base_path",
          ]

          with open("message.json", encoding="utf-8") as handle:
              message = json.load(handle)

          if not isinstance(message, dict):
              print("::error::message.json must contain a JSON object queue message.")
              sys.exit(1)

          missing = [
              field
              for field in required
              if field not in message or message[field] in (None, "")
          ]

          if missing:
              print(
                  "::error::message.json is missing required queue message fields: "
                  + ", ".join(missing)
              )
              print(
                  "::error::Expected the ingestion queue message, not a Worker status response or callback payload."
              )
              sys.exit(1)

          print("Validated queue message for session_id=" + str(message["session_id"]))
          PY

      - name: Process ingestion job
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          for attempt in 1 2 3; do
            echo "Starting ingestion attempt $attempt of 3"

            if python -m pipeline process-queue \
              --message-file message.json \
              --artifact-destination r2 \
              --r2-bucket "$R2_BUCKET" \
              --callback-url "$WORKER_BASE_URL" \
              --callback-token "$INGESTION_API_TOKEN" \
              --defer-terminal-callbacks \
              --success-payload-file success-callback.json \
              $FORCE_FLAG; then
              echo "Ingestion attempt $attempt succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 60))
              echo "Ingestion attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            else
              echo "::error::Ingestion failed after 3 attempts"
              exit 1
            fi
          done

      - name: Verify remote R2 manifest
        id: session
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SESSION_ID="$(python -c "import json; print(json.load(open('message.json'))['session_id'])")"
          echo "id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          wrangler r2 object get "$R2_BUCKET/sessions/$SESSION_ID/manifest.json" --remote --file manifest-check.json
          python -m json.tool manifest-check.json > /dev/null
          python -c "import json; expected=json.load(open('message.json'))['session_id']; actual=json.load(open('manifest-check.json'))['session_id']; assert actual == expected, f'manifest session_id {actual} does not match {expected}'"

      - name: Summarize callback artifact records
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f success-callback.json ]; then
            echo "No success-callback.json; ingestion did not reach the success payload."
            exit 0
          fi

          # Approximate the Worker's validateArtifactRecord checks so a rejected
          # record is named here, in the log, instead of surfacing only as an
          # opaque "artifacts[N] has an invalid kind or path" 400. This prints
          # to the log deliberately: logs are not subject to the Actions
          # artifact storage quota, so it works even when uploads are blocked.
          #
          # This is a diagnostic aid, not a reimplementation. The Worker is the
          # authority and applies further checks (metadata shape, generated_at,
          # session ownership), so "no problems found" here does not guarantee
          # the Worker will accept the payload -- the printed records do.
          python - <<'PY'
          import json
          import re
          import urllib.parse

          KIND_PATTERN = re.compile(r"^[A-Za-z0-9._:-]+$")
          CHECKSUM_PATTERN = re.compile(r"^sha256:[a-f0-9]{64}$")
          MAX_SAFE_INTEGER = 2**53 - 1
          BAD_ESCAPE = re.compile(r"%(?![0-9A-Fa-f]{2})")


          def sanitize_path(raw):
              """Port of sanitizeArtifactPath in worker/src/session-utils.mjs."""
              if BAD_ESCAPE.search(raw):
                  raise ValueError("path contains invalid encoding")
              candidate = urllib.parse.unquote(raw, errors="strict")
              candidate = re.sub(r"^/+", "", candidate)
              candidate = re.sub(r"^data/+", "", candidate)
              candidate = candidate.replace("\\", "/")
              if not candidate:
                  raise ValueError("path is empty")
              if len(candidate.encode("utf-8")) > 1024:
                  raise ValueError("path exceeds 1024 bytes")
              if "\0" in candidate:
                  raise ValueError("path contains a NUL byte")
              segments = candidate.split("/")
              if any(segment == ".." for segment in segments):
                  raise ValueError("path contains parent directory segments")
              if any(not segment or segment == "." for segment in segments):
                  raise ValueError("path contains empty or dot segments")
              return candidate


          with open("success-callback.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          records = payload.get("artifacts")
          if records is None:
              print("No artifacts key in the success payload.")
              raise SystemExit(0)
          if not isinstance(records, list):
              print(f"artifacts must be an array, got {type(records).__name__}.")
              raise SystemExit(0)

          print(f"{len(records)} artifact record(s) in the success payload")

          flagged = 0
          for index, record in enumerate(records):
              # Never let a malformed record abort the summary; naming the bad
              # index is the entire point of this step.
              if not isinstance(record, dict):
                  flagged += 1
                  print(f"  [{index}] <-- PROBLEM: record must be an object, got {type(record).__name__}")
                  continue

              kind = record.get("kind")
              path = record.get("path")
              checksum = record.get("checksum")
              size_bytes = record.get("size_bytes")

              problems = []
              # The Worker coerces via optionalString, which rejects non-strings
              # outright rather than stringifying them.
              if not isinstance(kind, str) or not kind:
                  problems.append("kind must be a non-empty string")
              elif len(kind) > 64:
                  problems.append("kind exceeds 64 characters")
              elif not KIND_PATTERN.match(kind):
                  problems.append("kind fails the Worker pattern")

              if not isinstance(path, str) or not path:
                  problems.append("path must be a non-empty string")
              else:
                  try:
                      sanitize_path(path)
                  except (ValueError, UnicodeDecodeError) as error:
                      problems.append(str(error))

              if (
                  not isinstance(size_bytes, int)
                  or isinstance(size_bytes, bool)
                  or size_bytes < 0
                  or size_bytes > MAX_SAFE_INTEGER
              ):
                  problems.append("size_bytes must be a safe non-negative integer")

              if not isinstance(checksum, str) or not CHECKSUM_PATTERN.match(checksum):
                  problems.append("checksum must be a lowercase sha256")

              suffix = ""
              if problems:
                  flagged += 1
                  suffix = "  <-- PROBLEM: " + ", ".join(problems)
              print(f"  [{index}] kind={kind!r} path={path!r}{suffix}")

          print(f"{flagged} record(s) failed these checks (the Worker may reject others).")
          PY

      - name: Report ingestion success
        env:
          JOB_ID: ${{ steps.message.outputs.job_id }}
        run: >-
          python -c "import json, os; from pipeline.local_queue_worker import callback_job_status;
          callback_job_status(os.environ['WORKER_BASE_URL'], os.environ.get('INGESTION_API_TOKEN'),
          os.environ['JOB_ID'], json.load(open('success-callback.json')))"

      - name: Upload ingestion diagnostics
        if: always()
        # Never let a diagnostics upload decide the fate of the run. The
        # session data is already durable in R2 by this point, and a blocked
        # or throttled upload must not turn a successful ingestion red and
        # trigger the failure callback below.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-diagnostics
          path: |
            message-summary.json
            manifest-check.json
            success-callback.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Report workflow failure
        if: failure() && steps.message.outputs.job_id != '' && env.WORKER_BASE_URL != ''
        env:
          JOB_ID: ${{ steps.message.outputs.job_id }}
        run: >-
          python -c "import os; from pipeline.local_queue_worker import callback_job_status;
          callback_job_status(os.environ['WORKER_BASE_URL'], os.environ.get('INGESTION_API_TOKEN'),
          os.environ['JOB_ID'], {'status': 'failed', 'error_message':
          'GitHub Actions ingestion workflow failed before completion'})"
