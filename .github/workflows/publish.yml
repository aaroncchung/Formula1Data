name: Build and publish

# The build stage of the data plane: read the source archive in R2, build every
# session that needs it, publish to R2 and derive the index. It never contacts
# F1, which refuses hosted runners (docs/architecture-review-findings.md, AR-13),
# so it can run here while the fetch stage runs on a machine F1 answers.
#
# There is deliberately no concurrency group. Two runs at once are safe: every
# object that changes is written against the version that was read (section 6,
# rule 2), and the loser decides again.
on:
  workflow_dispatch:
    inputs:
      session_key:
        description: Limit to one F1 session key (empty for every archived session)
        default: ""
  # workflow_dispatch only works once this file is on the default branch. Until
  # then a push that touches this file runs it from the rewrite branch.
  push:
    branches:
      - rewrite/data-plane
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  publish:
    name: Build from the archive and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      F1DATA_STORE: r2
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Either an R2 key pair, or the Cloudflare API token, which doubles as
      # one (f1data/config.py). The key pair wins when both are set.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SESSION_KEY: ${{ inputs.session_key }}
    steps:
      # backend/app and pipeline are the old normaliser and artifact writer,
      # which the build still goes through (f1data/legacy.py) until the new
      # format lands. frontend/public/data is 1.2 GB and is not needed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            f1data
            backend/app
            pipeline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and publish
        run: |
          set -o pipefail
          arguments=(--season "$(date -u +%Y)")
          if [ -n "$SESSION_KEY" ]; then
            arguments+=(--session-key "$SESSION_KEY")
          fi
          python -m f1data build "${arguments[@]}" | tee publish-output.txt

      - name: Summarise
        if: always()
        run: |
          if [ -f publish-output.txt ]; then
            { echo '```'; cat publish-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
