name: Build and publish

# The build stage of the data plane: read the source archive in R2, build every
# session that needs it, publish to R2 and derive the index and the standings.
# It never contacts F1, which refuses hosted runners
# (docs/architecture-review-findings.md, AR-13), so it can run here while the
# fetch stage runs on a machine F1 answers.
#
# The sessions are split across several jobs that run side by side, and there
# is deliberately no concurrency group. That is safe by construction: every
# object that changes is written against the version that was read (section 6,
# rule 2), and the loser of a write decides again. Each job derives the index,
# so every run of this workflow is also a run of the plan's fourth acceptance
# criterion, two publishers started together, on the real bucket.
on:
  workflow_dispatch:
    inputs:
      session_key:
        description: Limit to one F1 session key (empty for every archived session)
        default: ""
  # workflow_dispatch only works once this file is on the default branch. Until
  # then a push that touches this file runs it from the rewrite branch.
  push:
    branches:
      - rewrite/data-plane
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

# An explicit shell makes every step run with "-eo pipefail". Without it a step
# that pipes into tee reports tee's success whatever came before the pipe.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build and publish, part ${{ matrix.part }} of 4
    runs-on: ubuntu-latest
    # A session builds in seconds. The limit is for a run that has stopped
    # making progress, not for one that is working.
    timeout-minutes: 60
    strategy:
      # One part failing says nothing about the others' sessions.
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    env:
      PYTHONUNBUFFERED: "1"
      F1DATA_STORE: r2
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Either an R2 key pair, or the Cloudflare API token, which doubles as
      # one (f1data/config.py). The key pair wins when both are set.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SESSION_KEY: ${{ inputs.session_key }}
      PART: ${{ matrix.part }}
    steps:
      # The build takes its analyses from backend/app/analysis.
      # frontend/public/data is 1.2 GB and is not needed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            f1data
            backend/app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and publish
        run: |
          arguments=(--season "$(date -u +%Y)" --shard "$PART/4")
          if [ -n "$SESSION_KEY" ]; then
            arguments+=(--session-key "$SESSION_KEY")
          fi
          python -m f1data build "${arguments[@]}" | tee publish-output.txt

      - name: Summarise
        if: always()
        run: |
          if [ -f publish-output.txt ]; then
            { echo '```'; cat publish-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
