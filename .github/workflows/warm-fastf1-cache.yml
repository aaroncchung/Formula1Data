name: Warm FastF1 cache

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to warm"
        required: true
        default: "2024"
      event:
        description: "Round number or FastF1 event name"
        required: true
        default: "9"
      session:
        description: "Session code or name, such as R, Q, FP1"
        required: true
        default: "R"
      force:
        description: "Force FastF1 reload even if processed data exists"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fastf1-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      FASTF1_LOAD_ATTEMPTS: ${{ vars.FASTF1_LOAD_ATTEMPTS || '3' }}
      FASTF1_RETRY_BASE_DELAY_SECONDS: ${{ vars.FASTF1_RETRY_BASE_DELAY_SECONDS || '5' }}
      FASTF1_OPTIONAL_LOAD_DELAY_SECONDS: ${{ vars.FASTF1_OPTIONAL_LOAD_DELAY_SECONDS || '1' }}
      WARM_YEAR: ${{ inputs.year }}
      WARM_EVENT: ${{ inputs.event }}
      WARM_SESSION: ${{ inputs.session }}
      WARM_FORCE: ${{ inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: backend/data/cache/fastf1
          key: ${{ runner.os }}-fastf1-${{ hashFiles('backend/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fastf1-${{ hashFiles('backend/requirements.txt') }}-
            ${{ runner.os }}-fastf1-

      - name: Show FastF1 cache state
        run: |
          if [ -d backend/data/cache/fastf1 ]; then
            CACHE_FILES="$(find backend/data/cache/fastf1 -type f | wc -l)"
            CACHE_BYTES="$(du -sh backend/data/cache/fastf1 | cut -f1)"
            echo "FastF1 cache contains ${CACHE_FILES} files (${CACHE_BYTES}) before warming."
          else
            echo "FastF1 cache directory does not exist yet."
          fi

      - name: Warm session cache
        run: |
          FORCE_FLAG=""
          if [ "$WARM_FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          python -m pipeline ingest-session \
            --year "$WARM_YEAR" \
            --event "$WARM_EVENT" \
            --session "$WARM_SESSION" \
            --no-build-artifacts \
            $FORCE_FLAG
