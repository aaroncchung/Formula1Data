name: Generate static artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Generate the offline sample, ingest one FastF1 session, or ingest race sessions for a season"
        required: true
        type: choice
        default: sample
        options:
          - sample
          - session
          - season
      year:
        description: "Year for mode=session or mode=season"
        required: false
        default: "2025"
      event:
        description: "FastF1 event name for mode=session"
        required: false
        default: "Monaco Grand Prix"
      session:
        description: "FastF1 session code for mode=session"
        required: false
        default: "R"
      force:
        description: "Replace existing processed session data"
        required: false
        type: boolean
        default: false
      commit_artifacts:
        description: "Commit changes under frontend/public/data"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sample artifacts
        if: github.event_name == 'schedule' || inputs.mode == 'sample'
        run: python -m pipeline generate --sample

      - name: Install ingestion dependencies
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'session' || inputs.mode == 'season')
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Ingest session and rebuild artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'session'
        env:
          YEAR: ${{ inputs.year }}
          EVENT: ${{ inputs.event }}
          SESSION: ${{ inputs.session }}
          FORCE: ${{ inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m pipeline ingest-session --year "$YEAR" --event "$EVENT" --session "$SESSION" $FORCE_FLAG

      - name: Ingest season and rebuild artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'season'
        env:
          YEAR: ${{ inputs.year }}
          FORCE: ${{ inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m pipeline ingest-season --year "$YEAR" $FORCE_FLAG

      - name: Show artifact changes
        run: git status --short -- frontend/public/data

      - name: Upload generated static data
        uses: actions/upload-artifact@v4
        with:
          name: static-data
          path: frontend/public/data

      - name: Commit generated artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.commit_artifacts
        run: |
          if git diff --quiet -- frontend/public/data; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          git commit -m "Update static F1 artifacts"
          git push

